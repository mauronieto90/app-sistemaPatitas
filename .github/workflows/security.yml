name: Pruebas de seguridad

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # lunes 06:17 UTC: detecta riesgos nuevos aunque no haya cambios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Pruebas de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Batería de pruebas (tests/security)
        run: npm test

      - name: Firestore rechaza lectura anónima
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://firestore.googleapis.com/v1/projects/patitas-peludas-4089f/databases/(default)/documents/ventas?pageSize=1&mask.fieldPaths=fecha")
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::error::Firestore permite leer ventas sin autenticación"
            exit 1
          fi
